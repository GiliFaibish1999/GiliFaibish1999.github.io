name: Deploy website to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build

      - name: Prepare GitHub Pages folder
        run: |
          rm -rf .github-pages
          mkdir -p .github-pages

          cp -a dist/client/. .github-pages/

          CSS_FILES=$(find .github-pages/assets -name "*.css" -type f | sort)
          JS_FILES=$(find .github-pages/assets -name "*.js" -type f | sort)

          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '  <meta charset="UTF-8" />'
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1.0" />'
            echo '  <title>Gili Faibish — Cloud Architect · DevOps · SRE</title>'
            echo '  <meta name="description" content="Gili Faibish — Cloud Architect, DevOps Engineer and SRE building AWS, Kubernetes and VMware platforms with Terraform, CI/CD and observability." />'
            for css in $CSS_FILES; do
              css_path="${css#.github-pages/}"
              echo "  <link rel=\"stylesheet\" href=\"/$css_path\" />"
            done
            echo '</head>'
            echo '<body>'
            echo '  <div id="root"></div>'
            for js in $JS_FILES; do
              js_path="${js#.github-pages/}"
              echo "  <script type=\"module\" src=\"/$js_path\"></script>"
            done
            echo '</body>'
            echo '</html>'
          } > .github-pages/index.html

          cp .github-pages/index.html .github-pages/404.html
          touch .github-pages/.nojekyll

          echo "Prepared GitHub Pages output:"
          find .github-pages -maxdepth 3 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
