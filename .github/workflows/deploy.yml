name: Deploy website to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build

      - name: Show build output
        run: |
          echo "Build output:"
          find dist -maxdepth 5 -type f | sort || true
          find .output -maxdepth 5 -type f | sort || true

      - name: Prepare GitHub Pages folder
        run: |
          rm -rf .github-pages
          mkdir -p .github-pages

          if [ -f "dist/index.html" ]; then
            cp -a dist/. .github-pages/
          elif [ -f "dist/client/index.html" ]; then
            cp -a dist/client/. .github-pages/
          elif [ -f "dist/public/index.html" ]; then
            cp -a dist/public/. .github-pages/
          elif [ -f ".output/public/index.html" ]; then
            cp -a .output/public/. .github-pages/
          else
            echo "No static index.html found."
            echo "GitHub Pages needs a static index.html."
            echo "Here is what was generated:"
            find dist -maxdepth 5 -type f | sort || true
            find .output -maxdepth 5 -type f | sort || true
            exit 1
          fi

          cp .github-pages/index.html .github-pages/404.html
          touch .github-pages/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
