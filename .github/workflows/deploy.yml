name: Deploy website to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build

      - name: Prepare GitHub Pages folder
        run: |
          rm -rf .github-pages
          mkdir -p .github-pages

          if [ -d "dist/client" ]; then
            cp -a dist/client/. .github-pages/
          elif [ -d "dist" ]; then
            cp -a dist/. .github-pages/
          elif [ -d ".output/public" ]; then
            cp -a .output/public/. .github-pages/
          else
            echo "Could not find a static build output folder."
            echo "Expected one of: dist/client, dist, .output/public"
            find . -maxdepth 3 -type d
            exit 1
          fi

          if [ -f ".github-pages/index.html" ]; then
            cp .github-pages/index.html .github-pages/404.html
          else
            echo "No index.html found in static output. GitHub Pages needs a static index.html."
            find .github-pages -maxdepth 3 -type f
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
