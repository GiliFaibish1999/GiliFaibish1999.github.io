name: Deploy website to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build

      - name: Show build output
        run: |
          echo "dist output:"
          find dist -maxdepth 5 -type f | sort || true

      - name: Prepare GitHub Pages folder
        run: |
          rm -rf .github-pages
          mkdir -p .github-pages

          if [ -d "dist/client" ]; then
            cp -a dist/client/. .github-pages/
          elif [ -d "dist" ]; then
            cp -a dist/. .github-pages/
          else
            echo "No build output found."
            find . -maxdepth 5 -type f | sort || true
            exit 1
          fi

          if [ -f ".github-pages/index.html" ]; then
            echo "index.html already exists."
          elif [ -f ".github-pages/_shell.html" ]; then
            echo "Using TanStack SPA shell as index.html."
            cp .github-pages/_shell.html .github-pages/index.html
          else
            echo "No index.html or _shell.html found."
            echo "GitHub Pages needs a static HTML entry file."
            find .github-pages -maxdepth 5 -type f | sort || true
            exit 1
          fi

          cp .github-pages/index.html .github-pages/404.html
          touch .github-pages/.nojekyll

          cat > .github-pages/deploy-info.txt <<EOF
          commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          run_id=${GITHUB_RUN_ID}
          deployed_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

          echo "Prepared GitHub Pages output:"
          find .github-pages -maxdepth 5 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
