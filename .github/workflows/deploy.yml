name: Deploy website to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build

      - name: Verify mobile-safe CSS
        run: |
          CSS_FILE="$(find dist/assets -name '*.css' | head -n 1)"

          echo "Checking CSS file: $CSS_FILE"

          if grep -q "oklch" "$CSS_FILE"; then
            echo "Found oklch() in built CSS. Mobile-safe color fix was not deployed."
            exit 1
          fi

          if grep -q "background-attachment:fixed" "$CSS_FILE"; then
            echo "Found background-attachment: fixed in built CSS. Mobile background fix was not deployed."
            exit 1
          fi

          echo "Mobile-safe CSS check passed."

      - name: Prepare GitHub Pages output
        run: |
          test -f dist/index.html
          test -d dist/assets

          cp dist/index.html dist/404.html
          touch dist/.nojekyll

          cat > dist/deploy-info.txt <<EOF
          commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          run_id=${GITHUB_RUN_ID}
          deployed_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

          echo "Prepared files:"
          find dist -maxdepth 3 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        