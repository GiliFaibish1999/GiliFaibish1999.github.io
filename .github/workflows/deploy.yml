name: Build and publish website to gh-pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-branch"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch master "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git log -1 --oneline

      - name: Install dependencies
        run: |
          cd repo
          npm install

      - name: Build site
        run: |
          cd repo
          npm run build

      - name: Prepare GitHub Pages output
        run: |
          cd repo

          cp dist/index.html dist/404.html
          touch dist/.nojekyll

          cat > dist/deploy-info.txt <<EOF
          commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          run_id=${GITHUB_RUN_ID}
          deployed_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

          echo "Prepared files:"
          find dist -maxdepth 3 -type f | sort

      - name: Publish dist to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf ../pages
          mkdir ../pages
          cp -a dist/. ../pages/

          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
            rm -rf ./*
            cp -a ../pages/. .
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
            cp -a ../pages/. .
          fi

          git add -A
          git commit -m "Deploy website from ${GITHUB_SHA}" || echo "No changes to deploy"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages --force
          